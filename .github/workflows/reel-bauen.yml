name: Reel bauen

on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Name der Spec-Datei in reels/specs (ohne .json)'
        required: true
      voice:
        description: 'Optional: ElevenLabs-Stimmen-ID (leer = Markus)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Abhängigkeiten
        run: |
          pip install pillow playwright
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-color-emoji ffmpeg
      - name: Reel bauen (Slides, Ton, Video)
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ inputs.voice }}
        run: python3 reels/build_reel.py "${{ inputs.slug }}"
      - name: Vorschau ins Repo legen
        run: |
          git config user.name  "story-bot"
          git config user.email "story-bot@users.noreply.github.com"
          git add out/reels
          git commit -m "Reel-Vorschau: ${{ inputs.slug }}" || echo "Keine Änderung"
          git pull --rebase origin main
          git push
