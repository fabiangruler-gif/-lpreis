name: Reel veröffentlichen

on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Name des gebauten Reels (out/reels/<slug>.mp4)'
        required: true

jobs:
  reel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reel veröffentlichen
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          RAW="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/out/reels"
          COVER=""
          if [ -f "out/reels/${{ inputs.slug }}_cover.jpg" ]; then COVER="$RAW/${{ inputs.slug }}_cover.jpg"; else echo "WARNUNG: kein Cover vorhanden, Instagram nimmt das erste Videobild"; fi
          python3 publish_reel.py --video-url "$RAW/${{ inputs.slug }}.mp4" --caption-file "out/reels/${{ inputs.slug }}.txt" --cover-url "$COVER"
