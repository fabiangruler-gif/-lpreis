name: Reel veröffentlichen

on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Name des gebauten Reels (out/reels/<slug>.mp4)'
        required: true

jobs:
  reel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reel veröffentlichen
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          python3 publish_reel.py --video-url "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/out/reels/${{ inputs.slug }}.mp4" --caption-file "out/reels/${{ inputs.slug }}.txt"
