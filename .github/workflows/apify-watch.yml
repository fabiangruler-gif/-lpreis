name: Markt-Beobachtung (Apify)

# Wöchentlich (Sonntag 08:00 UTC) und manuell. Braucht das Secret APIFY_TOKEN.
on:
  schedule:
    - cron: "0 8 * * 0"
  workflow_dispatch:
    inputs:
      nur_pruefen:
        description: "Nur Kosten schätzen, nichts abrufen (true/false)"
        required: true
        default: "true"

permissions:
  contents: write
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Abrufen und auswerten
        shell: bash
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          if [ "${{ inputs.nur_pruefen }}" = "true" ]; then python apify_watch.py --dry-run
          else python apify_watch.py 2>&1 | tee watch.log; fi
      - name: Ergebnisse ablegen
        if: ${{ inputs.nur_pruefen != 'true' }}
        run: |
          git config user.name  "story-bot"
          git config user.email "story-bot@users.noreply.github.com"
          git add watch/
          git commit -m "Wochenübersicht $(date -u +%F)" || echo "Keine Änderung"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
      - name: Fehler melden (Issue)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Markt-Beobachtung fehlgeschlagen"
          BODY="Lauf: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. Mögliche Ursachen: APIFY_TOKEN fehlt oder ungültig, Free-Guthaben aufgebraucht."
          N=$(gh issue list --state open --search "$TITLE in:title" --json number -q '.[0].number' 2>/dev/null || true)
          if [ -n "$N" ]; then gh issue comment "$N" --body "$BODY" || true; else gh issue create --title "$TITLE" --body "$BODY" || true; fi
